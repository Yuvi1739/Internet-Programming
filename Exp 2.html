<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>StayScape Hotel Booking</title>
<style>
:root{--teal:#087f8c;--ink:#172b3a;--muted:#6b7a86;--line:#e3e9ec;--bg:#f5f7f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer}.primary{background:var(--teal);color:white}.secondary{background:#e3f4f4;color:#06626c}.plain{background:white;border:1px solid var(--line)}.danger{background:#fff0ef;color:#b93838}header{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:4}.brand{font-size:22px;font-weight:800}.brand span{color:var(--teal)}.actions{display:flex;gap:8px;align-items:center}.wrap{max-width:1150px;margin:auto;padding:26px 20px}.hero{background:linear-gradient(120deg,#123943,#087f8c);border-radius:20px;padding:38px;color:white;margin-bottom:25px}.hero small{letter-spacing:2px;text-transform:uppercase}.hero h1{font-size:clamp(30px,4vw,48px);margin:12px 0}.hero p{line-height:1.6;max-width:650px;color:#d7eeee}.search{background:white;padding:14px;border-radius:14px;display:grid;grid-template-columns:1.3fr 1fr 1fr .7fr auto;gap:10px;color:var(--ink)}.field{display:flex;flex-direction:column;gap:6px;min-width:0;margin:8px 0}.field label{font-size:11px;font-weight:bold;text-transform:uppercase;color:var(--muted)}.field input,.field select,.field textarea{padding:11px;border:1px solid var(--line);border-radius:8px;width:100%;min-width:0;background:white}.search .field input,.search .field select{border:0;padding:7px 0}.search button{align-self:end}.heading{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:28px 0 17px}.heading h2{margin:0;font-size:24px}.heading p,.muted{color:var(--muted);font-size:13px;line-height:1.6}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card,.panel{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden}.art{height:170px;background:linear-gradient(135deg,#d7e8e5,#86b7b3);display:grid;place-items:center;font-size:70px}.art.a2{background:linear-gradient(135deg,#eee1cd,#c69e6b)}.art.a3{background:linear-gradient(135deg,#d8e0ee,#8fa4c5)}.art.a4{background:linear-gradient(135deg,#f0dfd6,#d5a795)}.cardbody{padding:17px}.card h3{margin:7px 0}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0}.chips span{background:#f1f5f6;padding:6px 8px;border-radius:6px;font-size:11px;color:#52636e}.price-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:13px;margin-top:12px}.price{font-size:21px;font-weight:bold}.panel{padding:22px;margin:17px 0}.panel h2{margin-top:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:16px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:27px;margin-top:8px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tab{background:#e9eef0;color:#53636d}.tab.active{background:var(--teal);color:white}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;background:#f5f8f9;color:var(--muted);font-size:10px;padding:12px;text-transform:uppercase}td{padding:12px;border-bottom:1px solid #edf0f2;font-size:13px}.badge{padding:5px 9px;border-radius:20px;background:#e5f6ee;color:#18794e;font-size:11px;font-weight:bold}.badge.cancelled{background:#ffeded;color:#b93838}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.footer{background:#122e38;color:#d4e1e4;padding:30px 5%;margin-top:35px}.footgrid{max-width:1150px;margin:auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:22px}.footer p,.footer a{font-size:12px;color:#b5c8cc;line-height:1.8;cursor:pointer}.footer h3{font-size:13px;color:white}.footbottom{max-width:1150px;margin:20px auto 0;border-top:1px solid #ffffff25;padding-top:14px;font-size:11px}.modalbg{position:fixed;inset:0;background:#102a33a8;z-index:10;display:grid;place-items:center;padding:18px}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:white;border-radius:17px;padding:25px}.modal h2{margin-top:0}.notice{background:#eff8f8;color:#36616a;padding:12px;border-radius:9px;font-size:12px;line-height:1.6}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.login{max-width:420px;margin:9vh auto;background:white;padding:30px;border-radius:18px;border:1px solid var(--line)}.login h1{margin:0}.empty{text-align:center;padding:28px;color:var(--muted)}.roomline{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);padding:14px;border-radius:11px;margin:10px 0}.roomline h3{margin:0 0 6px}.roomline p{margin:0;color:var(--muted);font-size:12px}
@media(max-width:850px){.search{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.footgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){header{padding:0 12px}.brand{font-size:18px}.actions .signed{display:none}.wrap{padding:16px 12px}.hero{padding:25px 17px}.search,.cards,.grid2,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:15px}.heading{align-items:start;flex-direction:column}.footgrid{grid-template-columns:1fr}.stats{gap:8px}}
</style></head>
<body><div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
const KEY='stayscape_demo_v1';
const seed={users:[{id:1,name:'Hotel Administrator',email:'admin@stayscape.demo',password:'admin123',role:'admin',phone:'',address:''},{id:2,name:'Guest User',email:'guest@stayscape.demo',password:'guest123',role:'user',phone:'',address:''}],rooms:[{id:1,type:'Standard Room',price:2499,quantity:12,amenities:'Queen bed, Wi-Fi, Air conditioning',desc:'Comfortable and thoughtfully designed for short stays.'},{id:2,type:'Deluxe Room',price:3799,quantity:8,amenities:'King bed, Wi-Fi, City view',desc:'Extra space and upgraded amenities for a relaxed stay.'},{id:3,type:'Executive Suite',price:6499,quantity:4,amenities:'King bed, Lounge, Work desk',desc:'A spacious suite with a separate sitting area.'},{id:4,type:'Family Room',price:7999,quantity:3,amenities:'Two beds, Family lounge, Breakfast',desc:'Room to unwind together, ideal for families.'}],bookings:[],pages:{about:'StayScape offers thoughtfully designed rooms and friendly service for business and leisure travellers.',contact:'Email: hello@stayscape.demo | Phone: +91 44 4000 1234 | Chennai, Tamil Nadu, India',faq:'Check-in begins at 2:00 PM and check-out is by 11:00 AM. Contact reception for early check-in requests.',travel:'Explore local attractions, restaurants and public transport before your stay. Ask reception for directions and local recommendations.',privacy:'This educational demo stores account and booking information in your browser only. Do not enter real payment details or sensitive personal information.'},next:100};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}let db=load(),me=null,view='home',adminTab='rooms',q={destination:'',checkin:'',checkout:'',guests:'2'};
const today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₹'+Number(n||0).toLocaleString('en-IN'),nights=(a,b)=>Math.max(0,Math.round((new Date(b)-new Date(a))/86400000));
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function toast(s){document.getElementById('toast').innerHTML=`<div style="position:fixed;right:20px;bottom:20px;background:#122e38;color:white;padding:13px 17px;border-radius:9px;z-index:30">${esc(s)}</div>`;setTimeout(()=>document.getElementById('toast').innerHTML='',2600)}
function btn(t,c,fn){return `<button class="${c}" onclick="${fn}">${t}</button>`}function go(v){view=v;render();scrollTo(0,0)}function closeModal(){document.getElementById('modal').innerHTML=''}function user(id){return db.users.find(x=>x.id===id)||{name:'Unknown guest'}}
function free(r,ci,co,exclude=null){if(!ci||!co||co<=ci)return r.quantity;let max=0;for(let d=new Date(ci+'T00:00:00');d<new Date(co+'T00:00:00');d.setDate(d.getDate()+1)){let day=d.toISOString().slice(0,10),used=db.bookings.filter(b=>b.roomId===r.id&&b.status==='Confirmed'&&b.id!==exclude&&b.checkin<=day&&b.checkout>day).length;max=Math.max(max,used)}return Math.max(0,r.quantity-max)}
function canEdit(b){return Math.floor((new Date(b.checkin+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)>=3}
function footer(){return `<footer class="footer"><div class="footgrid"><div><div class="brand" style="color:white">Stay<span>Scape</span></div><p>A comfortable stay begins with an easy booking. Discover room options and plan your next trip.</p></div><div><h3>Explore</h3><p><a onclick="go('home')">Find a room</a><br><a onclick="go('rooms')">Room information</a><br><a onclick="go('about')">About us</a></p></div><div><h3>Guest support</h3><p><a onclick="go('faq')">Customer service Q&A</a><br><a onclick="go('travel')">Local travel guide</a><br><a onclick="go('contact')">Contact us</a></p></div><div><h3>Policies</h3><p><a onclick="go('privacy')">Privacy policy</a><br>Check-in 2 PM · Check-out 11 AM</p></div></div><div class="footbottom">© 2026 StayScape · Internet Programming Lab Experiment · Demo only</div></footer>`}
function shell(s){document.getElementById('app').innerHTML=`<header><div class="brand">⌂ Stay<span>Scape</span></div><div class="actions">${me?`<span class="signed muted">${esc(me.name)}</span>${btn('Dashboard','secondary',"go('dashboard')")}${me.role==='admin'?btn('Admin panel','plain',"go('admin')"):''}${btn('Log out','plain','logout()')}`:`${btn('Sign in','plain','login()')}${btn('Create account','primary','register()')}`}</div></header>${s}${footer()}`}
function render(){let s='';if(view==='home')s=home();else if(view==='rooms')s=roomsPage();else if(view==='dashboard')s=dashboard();else if(view==='admin')s=adminPage();else s=staticPage(view);shell(s)}
function roomCard(r){let av=free(r,q.checkin,q.checkout);return `<article class="card"><div class="art ${['','a2','a3','a4'][r.id-1]}">${['🛏️','🪟','🛋️','🛏️'][r.id-1]}</div><div class="cardbody"><div style="color:#9c6a12;font-size:12px">★★★★★ <span class="muted">Guest favourite</span></div><h3>${esc(r.type)}</h3><div class="muted">⌖ StayScape Hotel · Chennai, India</div><p class="muted">${esc(r.desc)}</p><div class="chips">${r.amenities.split(',').slice(0,3).map(x=>`<span>${esc(x.trim())}</span>`).join('')}</div><div class="price-row"><div><div class="price">${money(r.price)} <span class="muted" style="font-size:11px">/ night</span></div><small class="muted">${av} rooms available</small></div>${btn('View & book','primary',`book(${r.id})`)}</div></div></article>`}
function home(){return `<main class="wrap"><section class="hero"><small>A better way to stay</small><h1>Find a room that feels like yours.</h1><p>Search available rooms, compare amenities and prices, and manage your stay from one simple dashboard.</p><form id="searchForm" class="search"><div class="field"><label>Destination</label><input name="destination" placeholder="City or hotel" value="${esc(q.destination)}"></div><div class="field"><label>Check-in</label><input name="checkin" type="date" min="${today()}" value="${q.checkin}" required></div><div class="field"><label>Check-out</label><input name="checkout" type="date" min="${q.checkin||today()}" value="${q.checkout}" required></div><div class="field"><label>Guests</label><select name="guests">${[1,2,3,4,5,6].map(n=>`<option ${String(n)===String(q.guests)?'selected':''}>${n}</option>`).join('')}</select></div><button class="primary">Search rooms</button></form></section><div class="heading"><div><h2>Rooms for every kind of trip</h2><p>Choose a room that fits your needs and budget.</p></div>${btn('View all rooms →','secondary',"go('rooms')")}</div><div class="cards">${db.rooms.slice(0,3).map(roomCard).join('')}</div><div class="heading"><div><h2>Stay with confidence</h2><p>Simple booking management, clear room information, and helpful guest support.</p></div></div><div class="grid2"><section class="panel"><h2>Flexible booking management</h2><p class="muted">View booking history and update or cancel a reservation up to 3 days before check-in.</p></section><section class="panel"><h2>Helpful guest support</h2><p class="muted">Find contact details, answers to common questions, local travel information and our privacy policy.</p></section></div></main>`}
function roomsPage(){return `<main class="wrap"><div class="heading"><div><h2>Our rooms</h2><p>Four room categories with clear pricing and availability.</p></div></div><div class="cards">${db.rooms.map(roomCard).join('')}</div></main>`}
function bookingTable(bs,admin=false){if(!bs.length)return '<div class="empty">No bookings found. Choose a room to make your first reservation.</div>';return `<div class="tablewrap"><table><thead><tr><th>Booking / guest</th><th>Room</th><th>Stay dates</th><th>Guests</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>${bs.map(b=>`<tr><td><b>${esc(b.id)}</b><div class="muted">${esc(b.guestName||user(b.userId).name)}</div></td><td>${esc(db.rooms.find(r=>r.id===b.roomId)?.type||'Removed room')}</td><td>${b.checkin}<div class="muted">to ${b.checkout}</div></td><td>${b.guests}</td><td>${money(b.total)}</td><td><span class="badge ${b.status==='Cancelled'?'cancelled':''}">${b.status}</span></td><td><div class="row">${!admin&&b.status==='Confirmed'&&canEdit(b)?btn('Modify','secondary',`modify('${b.id}')`)+btn('Cancel','danger',`cancel('${b.id}')`):!admin&&b.status==='Confirmed'?'<span class="muted">Within 3-day window</span>':'—'}${admin?btn('Edit','secondary',`adminEdit('${b.id}')`)+btn('Cancel','danger',`adminCancel('${b.id}')`):''}</div></td></tr>`).join('')}</tbody></table></div>`}
function dashboard(){let mine=db.bookings.filter(b=>b.userId===me.id).reverse();return `<main class="wrap"><div class="heading"><div><h2>Welcome, ${esc(me.name)}</h2><p>Manage your profile and hotel reservations.</p></div>${btn('+ Book a room','primary',"go('home')")}</div><div class="stats"><div class="stat"><span>Total bookings</span><strong>${mine.length}</strong></div><div class="stat"><span>Confirmed</span><strong>${mine.filter(b=>b.status==='Confirmed').length}</strong></div><div class="stat"><span>Cancelled</span><strong>${mine.filter(b=>b.status==='Cancelled').length}</strong></div><div class="stat"><span>Account</span><strong style="font-size:20px">Active</strong></div></div><section class="panel"><h2>My booking history</h2><p class="muted">Modify or cancel confirmed bookings at least 3 days before arrival.</p>${bookingTable(mine)}</section><section class="panel"><h2>My profile</h2><form id="profileForm" class="formgrid"><div class="field"><label>Full name</label><input name="name" value="${esc(me.name)}" required></div><div class="field"><label>Email address</label><input value="${esc(me.email)}" disabled></div><div class="field"><label>Phone</label><input name="phone" value="${esc(me.phone||'')}"></div><div class="field"><label>Address</label><input name="address" value="${esc(me.address||'')}"></div><div class="formactions full"><button class="primary">Save profile</button></div></form></section></main>`}
function adminPage(){return `<main class="wrap"><div class="heading"><div><h2>Administrator panel</h2><p>Manage room quantities, prices, reservations, accounts, and static website pages.</p></div></div><div class="tabs"><button class="tab ${adminTab==='rooms'?'active':''}" onclick="adminTab='rooms';render()">Room inventory</button><button class="tab ${adminTab==='bookings'?'active':''}" onclick="adminTab='bookings';render()">Bookings</button><button class="tab ${adminTab==='users'?'active':''}" onclick="adminTab='users';render()">User accounts</button><button class="tab ${adminTab==='pages'?'active':''}" onclick="adminTab='pages';render()">Static pages</button></div>${adminTab==='rooms'?`<section class="panel"><h2>Room types, quantities and nightly prices</h2>${db.rooms.map(r=>`<div class="roomline"><div><h3>${esc(r.type)}</h3><p>${esc(r.amenities)}</p></div><div class="row"><b>${r.quantity} rooms · ${money(r.price)}/night</b>${btn('Edit','secondary',`editRoom(${r.id})`)}</div></div>`).join('')}</section>`:adminTab==='bookings'?`<section class="panel"><h2>All reservations</h2>${bookingTable(db.bookings.slice().reverse(),true)}</section>`:adminTab==='users'?`<section class="panel"><h2>Registered accounts</h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Bookings</th></tr></thead><tbody>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td>${db.bookings.filter(b=>b.userId===u.id).length}</td></tr>`).join('')}</tbody></table></div></section>`:`<section class="panel"><h2>Edit static website information</h2><form id="pagesForm" class="formgrid">${[['about','About us'],['contact','Contact information'],['faq','Customer service Q&A'],['travel','Local travel guide'],['privacy','Privacy policy']].map(([k,l])=>`<div class="field full"><label>${l}</label><textarea name="${k}" rows="3">${esc(db.pages[k])}</textarea></div>`).join('')}<div class="formactions full"><button class="primary">Save page content</button></div></form><p class="notice">Changes are stored in this browser for demonstration.</p></section>`}</main>`}
function staticPage(p){let names={about:'About StayScape',contact:'Contact us',faq:'Customer service Q&A',travel:'Local travel guide',privacy:'Privacy policy'};return `<main class="wrap"><section class="panel" style="max-width:850px;margin:25px auto"><h2 style="font-size:30px">${names[p]}</h2><p style="white-space:pre-line;line-height:1.9" class="muted">${esc(db.pages[p])}</p>${p==='faq'?'<details open><summary>What are check-in and check-out times?</summary><p class="muted">Check-in is from 2 PM and check-out is by 11 AM.</p></details><details><summary>Can I change or cancel a booking?</summary><p class="muted">Yes, at least 3 days before check-in.</p></details><details><summary>Is payment real?</summary><p class="muted">No. This lab prototype simulates the booking flow and does not process payments.</p></details>':''}</section></main>`}
function login(){document.getElementById('modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><section class="login"><h1>Sign in</h1><p class="muted">Access your bookings or administrator tools.</p><form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="primary" style="width:100%">Sign in</button></form><div class="notice" style="margin-top:14px">Guest: guest@stayscape.demo / guest123<br>Admin: admin@stayscape.demo / admin123</div><p>${btn('Create account','secondary','register()')}</p></section></div>`;document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),u=db.users.find(x=>x.email.toLowerCase()===f.email.toLowerCase()&&x.password===f.password);if(!u)return toast('Incorrect email or password');me=u;closeModal();go(u.role==='admin'?'admin':'dashboard')}}
function register(){document.getElementById('modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><section class="modal"><h2>Create your account</h2><form id="registerForm" class="formgrid"><div class="field full"><label>Full name</label><input name="name" required></div><div class="field full"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password (min 6 characters)</label><input name="password" type="password" minlength="6" required></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field full"><label>Address</label><input name="address"></div><div class="formactions full"><button type="button" class="plain" onclick="closeModal()">Cancel</button><button class="primary">Create account</button></div></form></section></div>`;document.getElementById('registerForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(db.users.some(u=>u.email.toLowerCase()===f.email.toLowerCase()))return toast('Email already registered');me={...f,id:db.next++,role:'user'};db.users.push(me);save();closeModal();go('dashboard');toast('Account created')}}
function logout(){me=null;go('home')}
function book(id){if(!me){login();return}let ci=q.checkin||today(),co=q.checkout||new Date(Date.now()+86400000).toISOString().slice(0,10);bookingForm(id,null,{checkin:ci,checkout:co,guests:q.guests||2})}
function bookingForm(roomId,bid=null,defaults={}){let b=bid?db.bookings.find(x=>x.id===bid):null,r=db.rooms.find(x=>x.id===(b?b.roomId:roomId)),ci=b?.checkin||defaults.checkin||today(),co=b?.checkout||defaults.checkout||new Date(Date.now()+86400000).toISOString().slice(0,10);document.getElementById('modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><section class="modal"><h2>${bid?'Modify booking':'Book '+esc(r.type)}</h2><p class="muted">${esc(r.desc)} · ${money(r.price)} per night</p><form id="bookingForm" class="formgrid"><div class="field full"><label>Room type</label><select name="roomId">${db.rooms.map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>${esc(x.type)} — ${money(x.price)}/night</option>`).join('')}</select></div><div class="field"><label>Check-in</label><input type="date" name="checkin" min="${today()}" value="${ci}" required></div><div class="field"><label>Check-out</label><input type="date" name="checkout" min="${ci}" value="${co}" required></div><div class="field"><label>Guests</label><select name="guests">${[1,2,3,4,5,6].map(n=>`<option ${String(n)===String(b?.guests||defaults.guests||2)?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Guest name</label><input name="guestName" value="${esc(b?.guestName||me.name)}" required></div><div class="full notice" id="summary">Available rooms: ${free(r,ci,co,b?.id)}. Estimated total: ${money(r.price*nights(ci,co))}.</div><div class="full notice">Changes and guest cancellations are allowed at least 3 days before arrival. Payment is simulated; no real card details are requested.</div><div class="formactions full"><button type="button" class="plain" onclick="closeModal()">Close</button><button class="primary">${bid?'Save changes':'Confirm booking'}</button></div></form></section></div>`;let form=document.getElementById('bookingForm');function upd(){let f=Object.fromEntries(new FormData(form)),rr=db.rooms.find(x=>x.id===Number(f.roomId)),valid=f.checkout>f.checkin;document.getElementById('summary').textContent=valid?`Available rooms: ${free(rr,f.checkin,f.checkout,b?.id)}. Stay: ${nights(f.checkin,f.checkout)} night(s). Estimated total: ${money(rr.price*nights(f.checkin,f.checkout))}.`:'Select a valid check-out date.'}form.addEventListener('change',upd);form.onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(form)),rr=db.rooms.find(x=>x.id===Number(f.roomId));if(f.checkout<=f.checkin)return toast('Check-out must be after check-in');if(bid&&!canEdit(b))return toast('Changes only allowed at least 3 days before arrival');if(free(rr,f.checkin,f.checkout,b?.id)<1)return toast('No rooms available for these dates');let total=rr.price*nights(f.checkin,f.checkout);if(b)Object.assign(b,{roomId:rr.id,checkin:f.checkin,checkout:f.checkout,guests:+f.guests,guestName:f.guestName,total});else db.bookings.push({id:'SS-'+String(db.next++),userId:me.id,roomId:rr.id,checkin:f.checkin,checkout:f.checkout,guests:+f.guests,guestName:f.guestName,total,status:'Confirmed',created:today(),payment:'Demo payment only'});save();closeModal();if(bid){go('dashboard');toast('Booking updated')}else{let latest=db.bookings[db.bookings.length-1];document.getElementById('modal').innerHTML=`<div class="modalbg"><section class="modal"><h2>✓ Booking confirmed</h2><p>Your demo reservation has been saved.</p><div class="notice">Confirmation: ${latest.id}<br>${esc(rr.type)}<br>${latest.checkin} → ${latest.checkout}<br>Total: ${money(total)}<br>No real payment processed or email sent.</div><div class="formactions"><button class="primary" onclick="closeModal();go('dashboard')">View my bookings</button></div></section></div>`}}}
function modify(id){let b=db.bookings.find(x=>x.id===id);if(!canEdit(b))return toast('Changes allowed at least 3 days before arrival');bookingForm(b.roomId,id)}
function cancel(id){let b=db.bookings.find(x=>x.id===id);if(!canEdit(b))return toast('Cancellation allowed at least 3 days before arrival');if(confirm('Cancel booking '+id+'?')){b.status='Cancelled';save();render();toast('Booking cancelled')}}
function editRoom(id){let r=db.rooms.find(x=>x.id===id);document.getElementById('modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><section class="modal"><h2>Edit ${esc(r.type)}</h2><form id="roomForm"><div class="field"><label>Room type</label><input name="type" value="${esc(r.type)}" required></div><div class="formgrid"><div class="field"><label>Price per night (₹)</label><input name="price" type="number" min="1" value="${r.price}" required></div><div class="field"><label>Room quantity</label><input name="quantity" type="number" min="1" value="${r.quantity}" required></div></div><div class="field"><label>Amenities</label><input name="amenities" value="${esc(r.amenities)}" required></div><div class="field"><label>Description</label><textarea name="desc" rows="3">${esc(r.desc)}</textarea></div><div class="formactions"><button type="button" class="plain" onclick="closeModal()">Cancel</button><button class="primary">Save room</button></div></form></section></div>`;document.getElementById('roomForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.price=+f.price;f.quantity=+f.quantity;if(f.quantity<db.bookings.filter(b=>b.roomId===id&&b.status==='Confirmed').length)return toast('Quantity cannot be below confirmed bookings');Object.assign(r,f);save();closeModal();render();toast('Room updated')}}
function adminEdit(id){let b=db.bookings.find(x=>x.id===id);document.getElementById('modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><section class="modal"><h2>Edit booking ${id}</h2><form id="adminBooking" class="formgrid"><div class="field full"><label>Guest name</label><input name="guestName" value="${esc(b.guestName)}" required></div><div class="field"><label>Room type</label><select name="roomId">${db.rooms.map(r=>`<option value="${r.id}" ${r.id===b.roomId?'selected':''}>${esc(r.type)}</option>`).join('')}</select></div><div class="field"><label>Guests</label><select name="guests">${[1,2,3,4,5,6].map(n=>`<option ${n===b.guests?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Check-in</label><input name="checkin" type="date" value="${b.checkin}" required></div><div class="field"><label>Check-out</label><input name="checkout" type="date" value="${b.checkout}" required></div><div class="field full"><label>Status</label><select name="status"><option ${b.status==='Confirmed'?'selected':''}>Confirmed</option><option ${b.status==='Cancelled'?'selected':''}>Cancelled</option></select></div><div class="formactions full"><button type="button" class="plain" onclick="closeModal()">Close</button><button class="primary">Save</button></div></form></section></div>`;document.getElementById('adminBooking').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),r=db.rooms.find(x=>x.id===+f.roomId);if(f.checkout<=f.checkin)return toast('Check-out must be after check-in');if(f.status==='Confirmed'&&free(r,f.checkin,f.checkout,b.id)<1)return toast('No rooms available for these dates');Object.assign(b,{...f,roomId:+f.roomId,guests:+f.guests,total:r.price*nights(f.checkin,f.checkout)});save();closeModal();render();toast('Booking updated')}}
function adminCancel(id){if(confirm('Administrator: cancel booking '+id+'?')){let b=db.bookings.find(x=>x.id===id);b.status='Cancelled';save();render();toast('Booking cancelled')}}
document.addEventListener('submit',e=>{if(e.target.id==='searchForm'){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(f.checkout<=f.checkin)return toast('Check-out must be after check-in');q=f;go('rooms')}if(e.target.id==='profileForm'){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));Object.assign(me,f);Object.assign(db.users.find(u=>u.id===me.id),me);save();render();toast('Profile saved')}if(e.target.id==='pagesForm'){e.preventDefault();Object.assign(db.pages,Object.fromEntries(new FormData(e.target)));save();render();toast('Website information saved')}});
render();
</script></body></html>
