<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Library Management System</title>
<style>
:root{--navy:#14213d;--blue:#3157d5;--light:#f4f7fc;--ink:#1d2939;--muted:#667085;--line:#e4e9f2;--green:#16865c;--orange:#b76e00;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--light);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:650}.primary{background:var(--blue);color:#fff}.secondary{background:#e9edff;color:#2746b8}.danger{background:#fff0ef;color:var(--red)}.success{background:#e8f8f0;color:var(--green)}.muted{color:var(--muted)}.hidden{display:none!important}
header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5}.brand{display:flex;gap:12px;align-items:center;font-weight:800;color:var(--navy);font-size:18px}.logo{width:39px;height:39px;background:var(--navy);color:white;display:grid;place-items:center;border-radius:12px;font-size:21px}.header-right{display:flex;gap:12px;align-items:center}.pill{background:#eef2ff;color:#344fc4;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:700}
.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 70px)}aside{background:var(--navy);padding:24px 14px;color:#fff}.side-label{text-transform:uppercase;letter-spacing:1.2px;color:#9ba9c7;font-size:10px;font-weight:800;padding:0 13px;margin:12px 0}.nav-btn{width:100%;display:flex;gap:12px;align-items:center;text-align:left;color:#d7def0;background:transparent;margin:3px 0;padding:12px 13px;font-weight:550}.nav-btn:hover,.nav-btn.active{background:#28395d;color:#fff}.nav-btn .ico{width:20px;text-align:center}.main{padding:30px;min-width:0}.welcome{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px}.welcome h1{margin:0 0 7px;font-size:27px;color:var(--navy)}.welcome p{margin:0;color:var(--muted)}.date{font-size:13px;color:var(--muted);background:white;border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 3px 12px #15294a05}.stat{padding:19px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.stat-icon{background:#eef2ff;color:var(--blue);width:36px;height:36px;display:grid;place-items:center;border-radius:11px;font-size:17px}.stat strong{display:block;font-size:27px;margin:13px 0 4px;color:var(--navy)}.stat small{color:var(--muted);font-size:12px}.panel{padding:21px;margin-bottom:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.panel h2{font-size:17px;margin:0;color:var(--navy)}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.field{border:1px solid #d8dfeb;border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink);min-width:0}.search{min-width:220px;flex:1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#667085;font-size:11px;text-transform:uppercase;letter-spacing:.6px;background:#f8faff;padding:12px}td{padding:14px 12px;border-bottom:1px solid #edf0f5;font-size:13px}tr:last-child td{border-bottom:0}.book-title{font-weight:700;color:var(--navy)}.sub{font-size:11px;color:var(--muted);margin-top:4px}.status{display:inline-block;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:750}.available{background:#e8f8f0;color:#16865c}.issued{background:#fff3df;color:#9a6100}.overdue{background:#ffedeb;color:#c0392b}.actions{display:flex;gap:6px}.actions button{padding:7px 9px;font-size:11px}.grid-two{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.empty{text-align:center;padding:32px;color:var(--muted)}.material-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.material{border:1px solid var(--line);border-radius:12px;padding:16px}.material .file{font-size:25px;margin-bottom:10px}.material h3{margin:0 0 6px;font-size:14px}.material p{margin:0 0 13px;color:var(--muted);font-size:12px}.material .meta{font-size:11px;color:#52617a;margin-bottom:13px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-group{display:flex;flex-direction:column;gap:6px}.form-group label{font-size:12px;font-weight:700;color:#475467}.form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid #d8dfeb;border-radius:9px;padding:11px;background:#fff}.form-group.full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.profile-row{display:flex;gap:18px;align-items:center}.avatar{height:65px;width:65px;border-radius:20px;background:#e9edff;color:var(--blue);display:grid;place-items:center;font-size:25px;font-weight:800}.toast{position:fixed;right:22px;bottom:22px;background:#14213d;color:#fff;padding:13px 18px;border-radius:10px;box-shadow:0 8px 30px #0002;z-index:20}.modal-backdrop{position:fixed;inset:0;background:#10182888;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:#fff;border-radius:16px;width:min(570px,100%);padding:24px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 18px;color:var(--navy)}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#e2e9ff,transparent 40%),var(--light)}.login-card{width:min(460px,100%);background:white;border:1px solid var(--line);box-shadow:0 20px 70px #14213d12;border-radius:20px;padding:34px}.login-card .brand{margin-bottom:25px}.login-card h1{font-size:25px;margin:0 0 8px;color:var(--navy)}.login-card p{color:var(--muted);font-size:14px;line-height:1.6}.login-card .form-group{margin:15px 0}.login-card button{width:100%;padding:12px}.demo{background:#f5f7ff;border-radius:10px;padding:12px;font-size:12px;color:#475467;line-height:1.7;margin-top:16px}.footer{text-align:center;color:#98a2b3;font-size:11px;padding:16px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:205px 1fr}.grid-two{grid-template-columns:1fr}.material-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:22px}}
@media(max-width:700px){header{padding:0 14px}.brand{font-size:15px}.layout{grid-template-columns:1fr}aside{padding:10px;display:flex;overflow:auto;gap:4px}.side-label{display:none}.nav-btn{width:auto;white-space:nowrap;margin:0;padding:10px}.nav-btn .ico{display:none}.main{padding:16px}.welcome{align-items:flex-start;flex-direction:column}.stats{gap:10px}.stat{padding:14px}.stat strong{font-size:23px}.material-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.date{display:none}.panel{padding:15px}.header-right .pill{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
const STORE='campusLibraryPrototype_v1';
const seed={
 users:[{id:1,name:'Library Admin',email:'admin@campus.edu',password:'admin123',role:'admin',studentId:'ADMIN-001',year:'',semester:''},{id:2,name:'Arun Kumar',email:'student@campus.edu',password:'student123',role:'student',studentId:'STU2026001',year:'2',semester:'3'}],
 books:[
 {id:101,title:'Introduction to Algorithms',author:'Thomas H. Cormen',category:'Computer Science',isbn:'9780262046305',year:'2022',copies:4,issued:1},
 {id:102,title:'Database System Concepts',author:'Abraham Silberschatz',category:'Computer Science',isbn:'9780078022159',year:'2020',copies:5,issued:0},
 {id:103,title:'Engineering Mathematics',author:'B. S. Grewal',category:'Mathematics',isbn:'9789352607019',year:'2021',copies:3,issued:2},
 {id:104,title:'Operating System Concepts',author:'Abraham Silberschatz',category:'Computer Science',isbn:'9781119800361',year:'2018',copies:3,issued:1},
 {id:105,title:'Principles of Management',author:'P. C. Tripathi',category:'Management',isbn:'9789352605312',year:'2023',copies:2,issued:0}
 ],
 loans:[{id:501,bookId:101,userId:2,issueDate:'2026-10-01',dueDate:'2026-10-20',returnDate:'',fine:0},{id:502,bookId:103,userId:2,issueDate:'2026-09-15',dueDate:'2026-09-29',returnDate:'',fine:30}],
 materials:[
 {id:1,title:'Data Structures - Unit Notes',subject:'Data Structures',year:'2',semester:'3',type:'PDF',description:'Unit-wise lecture notes for revision.',data:''},
 {id:2,title:'Database Management Systems',subject:'DBMS',year:'2',semester:'3',type:'PDF',description:'Important concepts, SQL and normalization.',data:''},
 {id:3,title:'Engineering Mathematics II',subject:'Mathematics',year:'1',semester:'2',type:'PDF',description:'Formula sheet and solved examples.',data:''}
 ],nextId:1000
};
function load(){try{const x=JSON.parse(localStorage.getItem(STORE));return x||structuredClone(seed)}catch(e){return structuredClone(seed)}}
let db=load(),current=null,view='dashboard',bookQuery='',materialQuery='',materialYear='all',materialSemester='all';
function save(){localStorage.setItem(STORE,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateToday(){return new Date().toISOString().slice(0,10)}
function userById(id){return db.users.find(u=>u.id===id)||{name:'Unknown user',studentId:'—'}}
function bookById(id){return db.books.find(b=>b.id===id)||{title:'Deleted book',author:'—'}}
function activeLoans(){return db.loans.filter(l=>!l.returnDate)}
function fineFor(l){const due=new Date(l.dueDate+'T00:00:00'),now=new Date(dateToday()+'T00:00:00');return l.returnDate?Number(l.fine||0):Math.max(0,Math.floor((now-due)/86400000))*10}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',2600)}
function btn(label,cls,action){return `<button class="${cls}" onclick="${action}">${label}</button>`}
function loginScreen(){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="login-card"><div class="brand"><div class="logo">▤</div><div>Campus Library<span class="muted" style="display:block;font-size:11px;font-weight:500;margin-top:3px">Management System</span></div></div><h1>Welcome back</h1><p>Sign in to search books, manage borrowing, and access study materials.</p><form id="loginForm"><div class="form-group"><label>Email address</label><input name="email" type="email" required placeholder="you@campus.edu"></div><div class="form-group"><label>Password</label><input name="password" type="password" required placeholder="Enter your password"></div><button class="primary" type="submit">Sign in</button></form><button class="secondary" style="width:100%;margin-top:10px" onclick="showRegister()">Create student account</button><div class="demo"><b>Demo accounts</b><br>Admin: admin@campus.edu / admin123<br>Student: student@campus.edu / student123</div><div class="footer">Campus Library · Academic resources in one place</div></div></div>`;
document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),u=db.users.find(x=>x.email.toLowerCase()===String(f.get('email')).toLowerCase()&&x.password===f.get('password'));if(!u){toast('Incorrect email or password');return}current=u;view='dashboard';render()};
}
function showRegister(){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Create student account</h2><form id="registerForm"><div class="form-grid"><div class="form-group full"><label>Full name</label><input name="name" required></div><div class="form-group"><label>Student ID</label><input name="studentId" required></div><div class="form-group"><label>Email</label><input name="email" type="email" required></div><div class="form-group"><label>Password</label><input name="password" type="password" minlength="6" required></div><div class="form-group"><label>Year</label><select name="year"><option>1</option><option>2</option><option>3</option><option>4</option></select></div><div class="form-group"><label>Semester</label><select name="semester">${[1,2,3,4,5,6,7,8].map(n=>`<option>${n}</option>`).join('')}</select></div></div><div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Register</button></div></form></div></div>`;
document.getElementById('registerForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(db.users.some(u=>u.email.toLowerCase()===f.email.toLowerCase()))return toast('Email is already registered');const u={...f,id:db.nextId++,role:'student'};db.users.push(u);save();current=u;closeModal();view='dashboard';render();toast('Account created successfully')}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function navItems(){const base=[['dashboard','▦','Dashboard'],['books','▤','Book Catalog'],['materials','▧','Study Materials'],['history','◷','My Borrow History'],['fines','₹','My Fines'],['profile','♙','My Profile']];if(current.role==='admin')return [['dashboard','▦','Dashboard'],['books','▤','Manage Books'],['loans','⇄','Issue / Return'],['materials','▧','Manage Materials'],['users','♙','Users'],['fines','₹','Fine Management'],['profile','⚙','My Profile']];return base}
function render(){if(!current){loginScreen();return}const admin=current.role==='admin';const nav=navItems();document.getElementById('app').innerHTML=`<header><div class="brand"><div class="logo">▤</div><span>Campus Library</span></div><div class="header-right"><span class="pill">${admin?'LIBRARIAN ADMIN':'STUDENT PORTAL'}</span><span style="font-size:13px;font-weight:700">${esc(current.name)}</span><button class="secondary" onclick="logout()">Logout</button></div></header><div class="layout"><aside><div class="side-label">Workspace</div>${nav.map(([id,ico,label])=>`<button class="nav-btn ${view===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('')}<div class="side-label" style="margin-top:28px">Account</div><button class="nav-btn" onclick="go('contact')"><span class="ico">✉</span>Contact Library</button></aside><main class="main" id="main">${pageContent()}</main></div>`}
function go(v){view=v;render()}
function logout(){current=null;view='dashboard';render()}
function pageContent(){switch(view){case'dashboard':return dashboard();case'books':return booksPage();case'loans':return loansPage();case'materials':return materialsPage();case'history':return historyPage();case'fines':return finesPage();case'users':return usersPage();case'profile':return profilePage();case'contact':return contactPage();default:return dashboard()}}
function heading(title,desc,action=''){return `<div class="welcome"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stat(label,value,icon,note){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><small>${note}</small></div>`}
function dashboard(){const admin=current.role==='admin',loans=activeLoans(),my=db.loans.filter(l=>l.userId===current.id),myFine=my.reduce((s,l)=>s+fineFor(l),0);return heading(admin?'Library overview':`Hello, ${esc(current.name.split(' ')[0])} 👋`,admin?'Monitor inventory, borrowing activity, and student accounts.':'Here is your library activity at a glance.',`<div class="date">${new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</div>`)+`<div class="stats">${stat('Total book titles',db.books.length,'▤','In library catalog')}${stat(admin?'Active issues':'My active books',admin?loans.length:my.filter(l=>!l.returnDate).length,'⇄',admin?'Books currently borrowed':'Currently borrowed by you')}${stat(admin?'Registered students':'My total fines',admin?db.users.filter(u=>u.role==='student').length:'₹'+myFine,'♙',admin?'Student accounts':'Outstanding fine amount')}${stat('Study materials',db.materials.length,'▧','Resources available')}</div><div class="grid-two"><section class="panel"><div class="panel-head"><h2>${admin?'Recent borrowing activity':'My current books'}</h2><button class="secondary" onclick="go('${admin?'loans':'history'}')">View all</button></div>${loansTable(admin?db.loans.slice(-5).reverse():my.filter(l=>!l.returnDate),admin)}</section><section class="panel"><div class="panel-head"><h2>Quick actions</h2></div><div style="display:grid;gap:10px">${btn('⌕ &nbsp; Search the catalog','secondary',"go('books')")}${btn('▧ &nbsp; Browse study materials','secondary',"go('materials')")}${admin?btn('+ &nbsp; Add a new book','primary','openBookForm()'):btn('₹ &nbsp; Check my fines','secondary',"go('fines')")}${admin?btn('⇄ &nbsp; Issue a book','secondary',"openIssueForm()"):btn('♙ &nbsp; Update my profile','secondary',"go('profile')")}</div><p class="muted" style="font-size:12px;line-height:1.6;margin:17px 0 0">Tip: Use the catalog search to find a title, author, or category. Check due dates to avoid late fees.</p></section></div>`}
function booksPage(){const admin=current.role==='admin';let books=db.books.filter(b=>[b.title,b.author,b.category,b.isbn].some(v=>String(v).toLowerCase().includes(bookQuery.toLowerCase())));return heading(admin?'Manage books':'Book catalog',admin?'Add, update, and maintain the library inventory.':'Search the catalog and check book availability.',admin?btn('+ Add book','primary','openBookForm()'):'')+`<section class="panel"><div class="panel-head"><h2>${books.length} book titles</h2><div class="toolbar"><input class="field search" placeholder="Search title, author, category, ISBN..." value="${esc(bookQuery)}" oninput="bookQuery=this.value;refreshBooks()"></div></div><div class="table-wrap" id="bookTable">${booksTable(books,admin)}</div></section>`}
function refreshBooks(){const el=document.getElementById('bookTable');if(el)el.innerHTML=booksTable(db.books.filter(b=>[b.title,b.author,b.category,b.isbn].some(v=>String(v).toLowerCase().includes(bookQuery.toLowerCase()))),current.role==='admin')}
function booksTable(books,admin){if(!books.length)return `<div class="empty">No books match your search.</div>`;return `<table><thead><tr><th>Book details</th><th>Category</th><th>Published</th><th>Availability</th><th>Status</th><th>Actions</th></tr></thead><tbody>${books.map(b=>{const available=b.copies-b.issued;return `<tr><td><div class="book-title">${esc(b.title)}</div><div class="sub">${esc(b.author)} · ISBN ${esc(b.isbn||'—')}</div></td><td>${esc(b.category)}</td><td>${esc(b.year||'—')}</td><td>${available} / ${b.copies}</td><td><span class="status ${available?'available':'issued'}">${available?'Available':'All issued'}</span></td><td><div class="actions">${admin?`<button class="secondary" onclick="openBookForm(${b.id})">Edit</button><button class="danger" onclick="deleteBook(${b.id})">Delete</button>`:available?`<button class="primary" onclick="requestIssue(${b.id})">Request issue</button>`:`<button class="secondary" disabled>Unavailable</button>`}</div></td></tr>`}).join('')}</tbody></table>`}
function loansTable(loans,admin){if(!loans.length)return `<div class="empty">No borrowing records to show.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Book / borrower</th><th>Issue date</th><th>Due date</th><th>Fine</th>${admin?'<th>Status / action</th>':'<th>Status</th>'}</tr></thead><tbody>${loans.map(l=>{const b=bookById(l.bookId),u=userById(l.userId),late=!l.returnDate&&l.dueDate<dateToday();return `<tr><td><div class="book-title">${esc(b.title)}</div><div class="sub">${admin?esc(u.name)+' · '+esc(u.studentId):'Borrowed by you'}</div></td><td>${l.issueDate}</td><td>${l.dueDate}</td><td>₹${fineFor(l)}</td><td>${l.returnDate?'<span class="status available">Returned</span>':late?'<span class="status overdue">Overdue</span>':'<span class="status issued">On loan</span>'}${admin&&!l.returnDate?`<div style="margin-top:7px"><button class="success" onclick="returnBook(${l.id})">Mark returned</button></div>`:''}</td></tr>`}).join('')}</tbody></table></div>`}
function loansPage(){return heading('Issue & return books','Track book circulation, due dates, and return status.',btn('+ Issue book','primary','openIssueForm()'))+`<section class="panel"><div class="panel-head"><h2>Active loans</h2><span class="pill">${activeLoans().length} active</span></div>${loansTable(activeLoans().slice().reverse(),true)}</section><section class="panel"><div class="panel-head"><h2>Recent returned books</h2></div>${loansTable(db.loans.filter(l=>l.returnDate).slice(-8).reverse(),true)}</section>`}
function materialsPage(){const admin=current.role==='admin';const mats=db.materials.filter(m=>(materialYear==='all'||m.year===materialYear)&&(materialSemester==='all'||m.semester===materialSemester)&&[m.title,m.subject,m.description].some(x=>String(x).toLowerCase().includes(materialQuery.toLowerCase())));return heading(admin?'Study material management':'Study materials',admin?'Upload and organize resources by academic year and semester.':'Find and download notes and academic resources.',admin?btn('+ Add material','primary','openMaterialForm()'):'')+`<section class="panel"><div class="panel-head"><h2>Resource library</h2><div class="toolbar"><input class="field search" placeholder="Search materials..." value="${esc(materialQuery)}" oninput="materialQuery=this.value;refreshMaterials()"><select class="field" onchange="materialYear=this.value;refreshMaterials()"><option value="all">All years</option>${[1,2,3,4].map(y=>`<option value="${y}" ${materialYear===String(y)?'selected':''}>Year ${y}</option>`).join('')}</select><select class="field" onchange="materialSemester=this.value;refreshMaterials()"><option value="all">All semesters</option>${[1,2,3,4,5,6,7,8].map(s=>`<option value="${s}" ${materialSemester===String(s)?'selected':''}>Semester ${s}</option>`).join('')}</select></div></div><div class="material-grid" id="materialGrid">${materialCards(mats,admin)}</div></section>`}
function refreshMaterials(){const el=document.getElementById('materialGrid');if(el)el.innerHTML=materialCards(db.materials.filter(m=>(materialYear==='all'||m.year===materialYear)&&(materialSemester==='all'||m.semester===materialSemester)&&[m.title,m.subject,m.description].some(x=>String(x).toLowerCase().includes(materialQuery.toLowerCase()))),current.role==='admin')}
function materialCards(mats,admin){if(!mats.length)return '<div class="empty">No materials found for these filters.</div>';return mats.map(m=>`<article class="material"><div class="file">📄</div><h3>${esc(m.title)}</h3><p>${esc(m.description||m.subject)}</p><div class="meta">${esc(m.subject)} · Year ${esc(m.year)} · Semester ${esc(m.semester)}</div><div class="toolbar">${btn('↓ Download','secondary',`downloadMaterial(${m.id})`)}${admin?btn('Delete','danger',`deleteMaterial(${m.id})`):''}</div></article>`).join('')}
function historyPage(){const mine=db.loans.filter(l=>l.userId===current.id).slice().reverse();return heading('My borrow history','Review issued books, due dates, return status, and fines.')+`<section class="panel"><div class="panel-head"><h2>Borrowing records</h2></div>${loansTable(mine,false)}</section>`}
function finesPage(){const records=(current.role==='admin'?db.loans:db.loans.filter(l=>l.userId===current.id)).filter(l=>fineFor(l)>0);const total=records.reduce((s,l)=>s+fineFor(l),0);return heading(current.role==='admin'?'Fine management':'My fines','Late return fines are calculated at ₹10 per day after the due date.')+`<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">${stat('Outstanding fine amount','₹'+total,'₹',current.role==='admin'?'Across all borrowing records':'Your current outstanding fines')}${stat('Records with fines',records.length,'◷','Includes saved fines on returned books')}</div><section class="panel"><div class="panel-head"><h2>Fine details</h2></div>${records.length?`<div class="table-wrap"><table><thead><tr><th>Book</th>${current.role==='admin'?'<th>Student</th>':''}<th>Due date</th><th>Return status</th><th>Fine amount</th></tr></thead><tbody>${records.map(l=>`<tr><td>${esc(bookById(l.bookId).title)}</td>${current.role==='admin'?`<td>${esc(userById(l.userId).name)}</td>`:''}<td>${l.dueDate}</td><td>${l.returnDate?'Returned':'Not returned'}</td><td><b>₹${fineFor(l)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No fines to show. You are all caught up!</div>'}</section>`}
function usersPage(){const users=db.users.filter(u=>u.role==='student');return heading('Student accounts','View registered users and their borrowing activity.')+`<section class="panel"><div class="panel-head"><h2>${users.length} registered students</h2></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Student ID</th><th>Email</th><th>Year / semester</th><th>Active loans</th><th>Outstanding fine</th></tr></thead><tbody>${users.map(u=>`<tr><td class="book-title">${esc(u.name)}</td><td>${esc(u.studentId)}</td><td>${esc(u.email)}</td><td>${esc(u.year||'—')} / ${esc(u.semester||'—')}</td><td>${activeLoans().filter(l=>l.userId===u.id).length}</td><td>₹${db.loans.filter(l=>l.userId===u.id).reduce((s,l)=>s+fineFor(l),0)}</td></tr>`).join('')}</tbody></table></div></section>`}
function profilePage(){return heading('My profile','Manage your account information.')+`<section class="panel"><div class="profile-row"><div class="avatar">${esc(current.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase())}</div><div><h2 style="margin:0 0 5px">${esc(current.name)}</h2><div class="muted">${esc(current.email)} · ${current.role==='admin'?'Librarian Admin':'Student'}</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><form id="profileForm"><div class="form-grid"><div class="form-group"><label>Full name</label><input name="name" value="${esc(current.name)}" required></div><div class="form-group"><label>Email address</label><input value="${esc(current.email)}" disabled></div><div class="form-group"><label>${current.role==='admin'?'Staff ID':'Student ID'}</label><input name="studentId" value="${esc(current.studentId||'')}"></div>${current.role==='student'?`<div class="form-group"><label>Year</label><select name="year">${[1,2,3,4].map(y=>`<option ${String(current.year)===String(y)?'selected':''}>${y}</option>`).join('')}</select></div><div class="form-group"><label>Semester</label><select name="semester">${[1,2,3,4,5,6,7,8].map(y=>`<option ${String(current.semester)===String(y)?'selected':''}>${y}</option>`).join('')}</select></div>`:''}</div><div class="form-actions"><button class="primary">Save profile</button></div></form></section>`}
function contactPage(){return heading('Contact the library','Send a question to the library team.')+`<section class="panel" style="max-width:720px"><h2 style="margin-bottom:18px">Contact form</h2><form id="contactForm"><div class="form-grid"><div class="form-group"><label>Your name</label><input name="name" value="${esc(current.name)}" required></div><div class="form-group"><label>Email address</label><input name="email" type="email" value="${esc(current.email)}" required></div><div class="form-group full"><label>Subject</label><input name="subject" required placeholder="How can we help?"></div><div class="form-group full"><label>Message</label><textarea name="message" rows="5" required placeholder="Write your message..."></textarea></div></div><div class="form-actions"><button class="primary">Send message</button></div><p class="muted" style="font-size:12px">Demo note: this form validates locally and does not send email until connected to a backend.</p></form></section>`}
function openBookForm(id=null){const b=id?db.books.find(x=>x.id===id):{title:'',author:'',category:'Computer Science',isbn:'',year:'2026',copies:1};document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${id?'Update book':'Add a book'}</h2><form id="bookForm"><div class="form-grid"><div class="form-group full"><label>Book title</label><input name="title" value="${esc(b.title)}" required></div><div class="form-group"><label>Author</label><input name="author" value="${esc(b.author)}" required></div><div class="form-group"><label>Category</label><input name="category" value="${esc(b.category)}" required></div><div class="form-group"><label>ISBN</label><input name="isbn" value="${esc(b.isbn)}"></div><div class="form-group"><label>Publication year</label><input name="year" value="${esc(b.year)}" type="number" min="1000" max="2100"></div><div class="form-group"><label>Total copies</label><input name="copies" value="${b.copies}" type="number" min="${b.issued||0}" required></div></div><div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save book</button></div></form></div></div>`;
document.getElementById('bookForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.copies=Number(f.copies);if(id){Object.assign(db.books.find(x=>x.id===id),f)}else db.books.push({...f,id:db.nextId++,issued:0});save();closeModal();render();toast(id?'Book updated':'Book added to catalog')}}
function deleteBook(id){if(db.books.find(b=>b.id===id)?.issued>0)return toast('Return all copies before deleting this book');if(!confirm('Delete this book from the catalog?'))return;db.books=db.books.filter(b=>b.id!==id);save();render();toast('Book deleted')}
function openIssueForm(){const avail=db.books.filter(b=>b.copies>b.issued);const students=db.users.filter(u=>u.role==='student');if(!avail.length)return toast('No books are currently available');if(!students.length)return toast('Register a student first');document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Issue a book</h2><form id="issueForm"><div class="form-grid"><div class="form-group full"><label>Book</label><select name="bookId" required>${avail.map(b=>`<option value="${b.id}">${esc(b.title)} (${b.copies-b.issued} available)</option>`).join('')}</select></div><div class="form-group full"><label>Student</label><select name="userId" required>${students.map(u=>`<option value="${u.id}">${esc(u.name)} · ${esc(u.studentId)}</option>`).join('')}</select></div><div class="form-group"><label>Issue date</label><input name="issueDate" type="date" value="${dateToday()}" required></div><div class="form-group"><label>Due date</label><input name="dueDate" type="date" value="${new Date(Date.now()+14*86400000).toISOString().slice(0,10)}" required></div></div><div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Confirm issue</button></div></form></div></div>`;
document.getElementById('issueForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(f.dueDate<f.issueDate)return toast('Due date cannot be before issue date');const b=bookById(Number(f.bookId));if(b.copies<=b.issued)return toast('No copies available');b.issued++;db.loans.push({id:db.nextId++,bookId:b.id,userId:Number(f.userId),issueDate:f.issueDate,dueDate:f.dueDate,returnDate:'',fine:0});save();closeModal();render();toast('Book issued successfully')}}
function requestIssue(id){if(current.role==='admin')return openIssueForm();const b=bookById(id);if(b.copies<=b.issued)return toast('No copies available');if(activeLoans().some(l=>l.userId===current.id&&l.bookId===id))return toast('You already have this book issued');b.issued++;db.loans.push({id:db.nextId++,bookId:id,userId:current.id,issueDate:dateToday(),dueDate:new Date(Date.now()+14*86400000).toISOString().slice(0,10),returnDate:'',fine:0});save();render();toast('Book issue recorded in demo')}
function returnBook(id){const l=db.loans.find(x=>x.id===id);if(!l||l.returnDate)return;const fine=fineFor(l);l.returnDate=dateToday();l.fine=fine;const b=bookById(l.bookId);b.issued=Math.max(0,b.issued-1);save();render();toast(fine?`Book returned. Fine recorded: ₹${fine}`:'Book returned successfully')}
function openMaterialForm(){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Add study material</h2><form id="materialForm"><div class="form-grid"><div class="form-group full"><label>Material title</label><input name="title" required></div><div class="form-group"><label>Subject</label><input name="subject" required></div><div class="form-group"><label>File type</label><select name="type"><option>PDF</option><option>DOCX</option><option>PPTX</option><option>TXT</option></select></div><div class="form-group"><label>Year</label><select name="year">${[1,2,3,4].map(y=>`<option>${y}</option>`).join('')}</select></div><div class="form-group"><label>Semester</label><select name="semester">${[1,2,3,4,5,6,7,8].map(y=>`<option>${y}</option>`).join('')}</select></div><div class="form-group full"><label>Description</label><textarea name="description" rows="3"></textarea></div><div class="form-group full"><label>Attach a file (optional)</label><input name="file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.txt" id="materialFile"></div></div><div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Add material</button></div></form></div></div>`;
document.getElementById('materialForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const file=document.getElementById('materialFile').files[0];let data='';if(file){if(file.size>1500000)return toast('For this demo, files must be under 1.5 MB');data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});f.title=f.title||file.name}db.materials.push({id:db.nextId++,title:f.title,subject:f.subject,type:f.type,year:f.year,semester:f.semester,description:f.description||'',data,filename:file?.name||''});save();closeModal();render();toast('Study material added')}}
function downloadMaterial(id){const m=db.materials.find(x=>x.id===id);if(!m)return;if(m.data){const a=document.createElement('a');a.href=m.data;a.download=m.filename||m.title.replace(/\s+/g,'_');document.body.appendChild(a);a.click();a.remove()}else{const blob=new Blob([`${m.title}\n${m.subject}\nYear ${m.year} · Semester ${m.semester}\n\n${m.description}\n\nDemo resource placeholder. Attach a real file through Admin > Manage Materials to enable file download.`],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=m.title.replace(/\s+/g,'_')+'.txt';a.click();URL.revokeObjectURL(a.href)}}
function deleteMaterial(id){if(!confirm('Delete this material?'))return;db.materials=db.materials.filter(m=>m.id!==id);save();render();toast('Material deleted')}
document.addEventListener('submit',e=>{if(e.target.id==='profileForm'){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));current.name=f.name;current.studentId=f.studentId;if(current.role==='student'){current.year=f.year;current.semester=f.semester}const u=db.users.find(u=>u.id===current.id);Object.assign(u,current);save();render();toast('Profile updated')}if(e.target.id==='contactForm'){e.preventDefault();e.target.reset();toast('Message validated (demo only; no email sent)')}});
render();
</script>
</body>
</html>
